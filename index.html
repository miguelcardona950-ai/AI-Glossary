<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glossary</title>
  <meta name="description" content="My personal glossary of coding terms.">

  <!-- Installing to the home screen -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Glossary">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">

  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js" onerror="appFailedToLoad()"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-side">
      <button type="button" class="topbar-back" id="back-button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        Back
      </button>
    </div>
    <h1 class="topbar-title" id="page-title">Glossary</h1>
    <div class="topbar-side"></div>
  </header>

  <main class="view" id="view">
    <div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>Opening your glossary…</div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <nav class="tabbar" id="tabbar" aria-label="Main" hidden>
    <a href="#/" class="tab" data-tab="list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="M9 7h6"/></svg>
      <span>Terms</span>
    </a>
    <a href="#/search" class="tab" data-tab="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search</span>
    </a>
    <a href="#/add" class="tab" data-tab="add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Add</span>
    </a>
  </nav>

  <noscript><p class="notice">This app needs JavaScript turned on.</p></noscript>

  <script>
    // If the app's code can't be downloaded (usually: no connection the very
    // first time you open it), say so instead of showing "Opening…" forever.
    function appFailedToLoad() {
      document.getElementById('view').innerHTML =
        '<section class="notice notice-error" role="alert">' +
        '<h2>Couldn’t load the app</h2>' +
        '<p>Your terms aren’t lost. The app’s code couldn’t be downloaded. Check your connection, then reload.</p>' +
        '<button type="button" class="button button-primary" onclick="location.reload()">Reload</button>' +
        '</section>';
    }

    // Lets the app open with no signal (see sw.js).
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
